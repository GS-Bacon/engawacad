<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EngawaCAD Viewer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      #app { width: 100%; height: 100%; position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      #error {
        display: none;
        position: absolute;
        top: 1rem;
        left: 1rem;
        background: #c0392b;
        color: white;
        padding: 0.75rem 1rem;
        border-radius: 4px;
        font-family: monospace;
        font-size: 14px;
        max-width: 80%;
        z-index: 10;
      }
      #info {
        display: none;
        position: absolute;
        top: 1rem;
        left: 1rem;
        background: #2980b9;
        color: white;
        padding: 0.75rem 1rem;
        border-radius: 4px;
        font-family: monospace;
        font-size: 14px;
        max-width: 80%;
        z-index: 10;
      }
      #selected-face {
        display: none;
        position: absolute;
        bottom: 1rem;
        left: 1rem;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        padding: 0.4rem 0.6rem;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        pointer-events: none;
        z-index: 10;
        min-height: 1em;
      }
      #selected-refplane {
        display: none;
        position: absolute;
        bottom: 2.5rem;
        left: 1rem;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        padding: 0.4rem 0.6rem;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        pointer-events: none;
        z-index: 10;
        min-height: 1em;
      }
      #extrude-panel {
        display: none;
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        padding: 0.75rem;
        border-radius: 4px;
        font-family: monospace;
        font-size: 14px;
        z-index: 10;
        pointer-events: auto;
      }
      #extrude-panel label { margin-right: 0.5rem; }
      #extrude-panel input { width: 5em; }
      #extrude-panel button { margin-left: 0.5rem; cursor: pointer; }
      #view-buttons {
        position: absolute;
        bottom: 1rem;
        right: 1rem;
        display: flex;
        gap: 0.4rem;
        z-index: 10;
      }
      #view-buttons button {
        background: rgba(0,0,0,0.5);
        color: white;
        border: none;
        padding: 0.4rem 0.6rem;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        cursor: pointer;
      }
      #btn-start-sketch {
        position: absolute;
        top: 1rem;
        right: 9rem;
        background: rgba(0,0,0,0.5);
        color: white;
        border: none;
        padding: 0.4rem 0.6rem;
        border-radius: 4px;
        font-family: monospace;
        font-size: 12px;
        cursor: pointer;
        z-index: 10;
      }
      #sketch-canvas {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 9;
      }
      #sketch-canvas[data-state="idle"] { display: none; }
      #sketch-canvas[data-state="open"], #sketch-canvas[data-state="closed"] { display: block; }
      #sketch-canvas.sketch-canvas--open { outline: 3px solid #e74c3c; outline-offset: -3px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="error" data-testid="error-msg"></div>
      <div id="info"></div>
      <div id="selected-face" data-testid="selected-face-id"></div>
      <div id="selected-refplane" data-testid="selected-refplane"></div>
      <div id="extrude-panel" data-testid="extrude-panel">
        <label>深さ <input type="number" data-testid="extrude-depth" min="0.1" step="0.1" value="5" /></label>
        <button data-testid="btn-extrude">押出</button>
        <button data-testid="btn-extrude-cut">押出カット</button>
      </div>
      <div id="view-buttons">
        <button data-testid="btn-view-front">Front</button>
        <button data-testid="btn-view-top">Top</button>
        <button data-testid="btn-view-iso">Iso</button>
      </div>
      <button data-testid="btn-start-sketch" id="btn-start-sketch">スケッチ開始</button>
      <div data-testid="sketch-canvas" id="sketch-canvas" data-state="idle"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
