<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyCad Viewer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      #app { width: 100%; height: 100%; position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      #error {
        display: none;
        position: absolute;
        top: 1rem;
        left: 1rem;
        background: #c0392b;
        color: white;
        padding: 0.75rem 1rem;
        border-radius: 4px;
        font-family: monospace;
        font-size: 14px;
        max-width: 80%;
        z-index: 10;
      }
      #info {
        display: none;
        position: absolute;
        top: 1rem;
        left: 1rem;
        background: #2980b9;
        color: white;
        padding: 0.75rem 1rem;
        border-radius: 4px;
        font-family: monospace;
        font-size: 14px;
        max-width: 80%;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="error"></div>
      <div id="info"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
