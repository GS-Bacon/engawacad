issues:
  - id: F01
    severity: high
    file: "crates/engawa-build/src/feature_crud.rs"
    line_hint: 179
    finding: "`refs_resolve_in_state` は `CreateSketch` の `plane_ref` だけを見ており、`Extrude` / `ExtrudeCut` は sketch ID が残っている限り executed 扱いのままです。`[box_1, sk(plane=box_1), Cut(box_1,...), e1(sketch=sk)]` のように sketch 作成後に `plane_ref` の body が dead になる history でも `e1` が `executed_at_*` に残るため、今回導入した transitive plane_ref lifetime ルールと `simulate_history` が不整合になり、broken-prefix history で downstream consumer の誤検出/見落としが起きます。"
    suggestion: "`Extrude` / `ExtrudeCut` の実行判定でも参照 sketch の implicit body refs を `live_bodies_at` に対して再検証し、`plane_ref` body が dead なら executed から除外してください。あわせて『sk は body live 時に作成済みだが、その後 body が consumed された後に sketch user が現れる』回帰テストを追加してください。"
  - id: F02
    severity: medium
    file: "crates/engawa-build/tests/feature_crud_plane_ref_acceptance.rs"
    line_hint: 1110
    finding: "`t14_266_extrudecut_via_sketch_user` が `displaced_feature_id == \"sk\"` でも通るため、`ec1` への transitive hit を強制できていません。T11/T12/T13/T15 も同様に `sk`/`e1` 両許容へ緩められており、`feature_transitive_implicit_body_refs` が sketch user 側で壊れても先行 `CreateSketch` consumer` だけでテストが通ります。"
    suggestion: "少なくとも 1 本は『先行 sketch consumer では満たせず、sketch user (`ec1` / `e1`) だけが hit する』fixture にして、transitive sketch-user 検出そのものを assertion で固定してください。"

verdict: fail