issues:
  - id: F01
    severity: high
    file: "web/src/main.ts"
    line_hint: 146
    finding: "`create_sketch` の POST 成功後に `extrude` / `extrude_cut` が失敗すると `pendingPostedSketchId` が残りますが、`btn-start-sketch` と `Escape` でこの state を消していません。失敗後に別の形状を描き直しても、送信側は `pendingPostedSketchId ?? nextId(...)` を優先して新しい `create_sketch` を再送せず、古いサーバ側スケッチ ID をそのまま押し出します。結果として、画面上で確定した最新スケッチと実際に生成される body が食い違います。"
    suggestion: "スケッチを破棄・再開始・差し替えする経路 (`btn-start-sketch`, `Escape`, 新しい finalize 採用時) で `pendingPostedSketchId` を必ず `null` に戻し、再利用は同一 `lastFinalizedSketch` をそのまま retry する場合にだけ許可する。"
  - id: F02
    severity: medium
    file: "web/tests/phase7_sketch_acceptance.spec.ts"
    line_hint: 304
    finding: "`D01_engawa_record_order` の extrude mock は `TriangleMesh` 契約どおりの `Array<[number, number, number]>` ではなく flat な `number[]` を `positions` / `normals` に返しています。`main.ts` は `handle.updateBodies(updated)` の例外を catch してしまうため、このテストは viewer 再構築が失敗しても POST 順序だけ見て pass でき、成功経路の回帰を検出できません。"
    suggestion: "mock 応答を有効な `TriangleMesh` 形式に直し、あわせて `#error` が表示されないことや `__meshDataVersion` / body count が更新されることも assert して、POST 後の成功経路まで実際に通す。"

verdict: fail