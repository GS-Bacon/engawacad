issues:
  - id: AM01
    severity: medium
    section: "テスト計画 > T02, T03"
    finding: "期待値が「例」として書かれ、テストの pass/fail 判定基準が曖昧。T02 は「数百以下、例 < 400」、T03 は「修正後 ~68、例 <= 120」となっており、実装者が 400/120 以外の値を選んだ場合にテストをどう修正するかが未定義"
    suggestion: "期待値を単一の具体値に固定するか、「期待値は計算により導出される: 穴フチエッジ数64 × (inner loop 用サンプリング補正 1) + ...」のように導出式を明示すること"
  - id: AM02
    severity: medium
    section: "テスト計画 > T04"
    finding: "ε_area が「要確認: 実装時に既存 ε を grep」となっており、設計段階で値が決定されていない。既存 ε が見つからなかった場合のフォールバック（1e-12）も「程度」と表現され、実装者の判断余地が残されている"
    suggestion: "設計レビュー段階で既存 ε を調査し、具体値（例: 既存コードでは 1e-9）を確定させる。見つからない場合は 1e-12 等の固定値を決定し記載すること"
  - id: AM03
    severity: low
    section: "数値モデル"
    finding: "全周(2π)→base 点、1/64弧→ceil(32/64)=1 点の例示は明確だが、base_segments が 64 の場合の 1/64 弧が 2 点になる（ceil(64/64)=2）等の境界ケースが未例示"
    suggestion: "現状の例示で実装に支障は無いが、base_segments 変更時の挙動を明示したい場合は「base_segments=N の場合、最小弧幅は 2π/N」と追記すること"

verdict: pass
# Critical/High なし。Medium 2件はテスト期待値の具体性に欠けるが、実装者が計算により導出可能（穴フチエッジ数は Boolean 側で決定的に 64 本）