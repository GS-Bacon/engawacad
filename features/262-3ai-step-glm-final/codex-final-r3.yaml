    finding: "`isValidReviewYaml()` が top-level の `issues:` と `verdict:` の存在だけで成功扱いするため、`issues:\\nnot yaml\\nverdict: pass` のような壊れた出力でも transport success になり、`parseVerdict()` が `{verdict:\"pass\", blocking:0}` を書いて STEP 7 をそのまま通せてしまう。逆に `issues: []\\nverdict: fail` も成功扱いになり `{verdict:\"fail\", blocking:0}` となるため、#262 で解消したかった no-branch 状態を再発させる。"
