    finding: "`Document` と `Feature::CreateSketch` に `variables` の必須フィールドを追加したため、外部 crate の struct literal / enum variant construction と exhaustive pattern match がそのままではコンパイル不能になる。YAML では optional でも Rust の public API としては source-breaking で、移行互換を前提にした今回のスコープに反する。"
    suggestion: "この変更は breaking change として扱い、少なくとも crate のメジャー更新を行うか、公開型を非破壊に拡張できる API（非公開フィールド + constructor/accessor、または互換レイヤ）へ切り替える。"
