# Merged Codex review (3 persona parallel, #231)
issues:
  - id: A-F01
    severity: high
    file: "crates/engawa-format/src/document.rs"
    line_hint: 61
    finding: "`Document::validate()` still only checks component/ref-plane/feature structure and never validates the newly added `Document.variables` or `CreateSketch.variables`. As a result, `.engawa` files with duplicate variable names, empty expressions, cycles, or undefined references pass `from_yaml()`/`to_yaml()` as if they were valid, even though `evaluate_scope()` would reject the same data."
    suggestion: "Extend document validation to walk document-level and sketch-level variable scopes and run variable-specific checks there (or call `evaluate_scope()` per sketch), then surface those failures through `FormatError` so parse/serialize keeps its semantic-validation contract."
  - id: C-F01
    severity: high
    file: "crates/engawa-format/src/document.rs"
    line_hint: 61
    finding: "`Document::validate()` が新設した `Document.variables` / `CreateSketch.variables` を一切検証しておらず、同一スコープ重複名・循環参照・未定義参照を含む `.engawa` が `from_yaml()` / `to_yaml()` を通過してしまう。`evaluate_scope()` 側で reject している不変条件が wire-format の受理境界で守られていない。"
    suggestion: "`validate()` / `validate_component()` で root/Sketch の variable scope を検査し、重複名・識別子不正・式評価エラーを `FormatError` として parse/serialize 時点で reject する"
  - id: M-F01
