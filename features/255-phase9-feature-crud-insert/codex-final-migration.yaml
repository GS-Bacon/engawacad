issues:
  - id: F01
    severity: high
    file: "crates/engawa-build/src/feature_crud.rs"
    line_hint: 64
    finding: "`next.validate()` only rechecks format-level invariants, so `FeatureCrud::insert` can return `Ok` for history-dependent features whose `sketch`/`target`/`tool` references are not valid at the chosen `at`, or that consume bodies still needed by later features. That lets `engawa entry add` write a `.engawa` file that later fails in `build_assembly` with `SketchNotFound`/`BodyNotFound`."
    suggestion: "After insertion, semantically validate the full ordered feature history against build rules before returning success, and add acceptance tests for insert-before-producer / insert-before-consumer cases."
  - id: F02
    severity: medium
    file: "crates/engawa-cli/tests/entry_add.rs"
    line_hint: 44
    finding: "`t04_entry_add_output_flag_writes_separate_file` checks only the output file bytes. It never verifies that the input file stayed unchanged, so the agreed `--output` non-overwrite contract is not actually regression-tested."
    suggestion: "Run T04 against a temp copy of the input and assert the input bytes are unchanged after `engawa entry add ... -o ...`."
  - id: F03
    severity: medium
    file: "crates/engawa-build/tests/fixtures/insert/invalid_empty_id.yaml"
    line_hint: 2
    finding: "The fixture uses `type: CreateBox`, which makes `serde_yaml::from_str::<Feature>` fail before `FeatureCrud::insert` runs. `t07_input_validation_propagates` therefore does not exercise the empty-id validation/error-propagation path it claims to cover."
    suggestion: "Change the fixture to a valid tag (`type: create_box`) and assert stderr contains the insert-time validation failure, not just any non-zero exit."
verdict: fail