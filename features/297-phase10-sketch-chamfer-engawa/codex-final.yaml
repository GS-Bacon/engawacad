    file: "crates/engawa-build/tests/sketch_chamfer_acceptance.rs"
    line_hint: 269
    finding: "T10 の build 側は 2 段目の `SketchChamfer` を `push` して `Extrude` の後ろで実行しているため、CRUD 側が検証している `[CreateSketch, c1, c2, Extrude]` と同じ履歴を固定できていない。現状のテストは派生 Line ID を build が解決できることしか証明しておらず、`Extrude` 前の current-profile 経路が壊れても緑のまま残る。"
    suggestion: "`features_build.push(...)` を `features_build.insert(2, ...)` に変え、build 側も CRUD 側と同じ位置で `c2` を適用して false-reject 契約を直接固定する。"
  - id: A02
    severity: medium
    file: "crates/engawa-build/tests/sketch_chamfer_acceptance.rs"
    line_hint: 387
    finding: "`ChamferLengthTooLarge` の境界規約 (`length > len - LENGTH_TOLERANCE`) を直接固定するテストが無い。現在あるのは `length=10.0` や `f64::MAX` のような大外れ値だけなので、比較を `>=` に変えたり tolerance を落としてもこの差分のテスト群は通ってしまう。"
    suggestion: "線長 1.0 の L 字ペアに対して `length = 1.0 - LENGTH_TOLERANCE` は成功、`length = 1.0` は `ChamferLengthTooLarge` を返す 2 ケースを追加し、本文で固定した数値境界を回帰テスト化する。"

