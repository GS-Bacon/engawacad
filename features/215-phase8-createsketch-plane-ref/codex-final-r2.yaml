    suggestion: "`feature.rs` の `CreateSketch` テストに `PlaneRef::RefPlane(\"Front\")` と `PlaneRef::Entity(...)` の 2 ケースを追加し、出力 YAML 形状と roundtrip を直接固定してください。"

