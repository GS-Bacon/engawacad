    severity: medium
    section: "設計方針 > 端点スナップ"
    finding: "端点スナップで SNAP_RADIUS 内に複数の既存頂点が同距離で存在する場合の決定性が未定義。配列走査順（最初に見つかったもの）に依存することになるが、これが設計として明記されていない。"
    suggestion: "同距離の場合の tie-break ルールを明記するか（例: インデックス最小）、または UI レイヤの決定性保証として 'snap は距離最小の単一頂点を選択し、同距離の場合は最早の頂点を優先' といった規約を追加すること。ただし通常のユースケースでこの状況は稀であり、実装上の実害は低い。"

  - id: IN02
