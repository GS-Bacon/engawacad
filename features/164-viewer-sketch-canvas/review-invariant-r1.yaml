    section: "テスト計画"
    finding: "T01-T06 は UI 統合テストだが、sketch.ts の純粋ロジック（addPoint, isClosed, finalize, snap）に対する決定性テストが存在しない。設計方針には 'vitest 単体テスト sketch.test.ts も追加' とあるが、テスト計画表に ID 付きで列挙されていない。"
    suggestion: "テスト計画表に T07_unit_determinism として '同一入力を 2 回 createSketchSession → addPoint して segments と isClosed() が同一であることを assert' を追加すること。"

  - id: IN03
