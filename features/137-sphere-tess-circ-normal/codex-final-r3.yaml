    suggestion: "trimmed sphere face の inner loop から `twin` で隣接 cyl lateral face を特定し、両 face の境界 ring 頂点列を抽出して各 index で `LENGTH_TOLERANCE` 以内かを比較する、計画どおりの T04 に差し替えてください。"

