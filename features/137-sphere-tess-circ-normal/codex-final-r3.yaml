issues:
  - id: F01
    severity: high
    file: "crates/mycad-kernel/src/tessellation/mod.rs"
    line_hint: 1050
    finding: "`InvalidTrimCircle` の検証が `signed_offset` だけで、`circ_center` の軸直交ずれや `circ_radius` の整合性を見ていません。`circ_center` が `axis` から外れている円や、`radius^2 != signed_offset^2 + circ_radius^2` の円でも受理され、実際の B-rep edge とは別の緯線を球面上に再合成して共有境界を壊します。"
    suggestion: "`perp = (circ_center - center) - signed_offset * axis` のノルムと、期待半径 `sqrt(radius * radius - signed_offset * signed_offset)` に対する `circ_radius` の差を `LENGTH_TOLERANCE` で検証し、外れた場合は `InvalidTrimCircle` を返してください。"
  - id: F02
