    severity: critical
    file: "crates/engawa-cli/src/main.rs"
    line_hint: 177
    finding: "レビュー対象の tracked diff には `entry edit` / `FeatureCrud::edit` の実装しか入っておらず、合意済みの T01-T05・golden YAML テストは diff に 1 件も含まれていない。`coverage_hints.total_added=0` は extractor の取りこぼしではなく、この patch のままだとテスト追加が着地しない。"
    suggestion: "`crates/engawa-build/tests/256_phase9_feature_crud_edit_acceptance.rs` と `crates/engawa-cli/tests/256_phase9_entry_edit_cli.rs` を tracked change として含め、T01/T03 の byte-equal YAML と退化ケースが実際の diff に入る状態で出し直す。"

