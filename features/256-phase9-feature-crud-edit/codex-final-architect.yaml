issues:
  - id: F01
    severity: critical
    file: "crates/engawa-build/src/feature_crud.rs"
    line_hint: 703
    finding: '`edit` は置換前ベースラインとして `without_old` を使っているため、元の feature を参照していた downstream が synthetic pre-state では既に inert 扱いになります。結果として `CreateSketch(sk_1)` を別 variant に差し替えても、その後段の `Extrude { sketch: "sk_1" }` や `Cut { target: "box_1" }` が壊れるケースを検出できず、`next.validate()` も履歴参照を検査しないため壊れた Document を返します。'
    suggestion: 'edit 用に「元の履歴を pre-state、置換後の履歴を post-state」として比較する validator を用意し、元の doc で実行できていた downstream consumer が置換後も実行できることを必須にしてください。'
  - id: F02
    severity: high
    file: "crates/engawa-build/src/feature_crud.rs"
    line_hint: 697
    finding: '`edit` は ID 一致しか見ていないので、`CreateBox(box_1)` を `CreateSphere(box_1)` のような別 topology contract の feature に差し替えられます。この場合、downstream の `PlaneRef::Entity(EntityRef::Named { feature_id: "box_1", role: "f_z_pos" })` は body が live でも role 解決に失敗し、後段 build で `FaceEntityRefNotFound` になります。'
    suggestion: '「params 差し替え」を守るなら同一 feature variant 以外を reject するか、少なくとも置換後の doc を一度 build して downstream の `EntityRef`/`plane_ref` 解決まで検証してから成功にしてください。'
verdict: fail