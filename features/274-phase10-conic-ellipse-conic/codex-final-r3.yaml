issues:
  - id: A-F01
    severity: high
    file: "crates/engawa-kernel/src/tessellation/sketch.rs"
    line_hint: 62
    finding: "Circle/Arc は center しか finite 検証しておらず、`radius` と `start_angle`/`end_angle` の NaN/Inf を通してしまう。特に Arc は `end_angle = +∞` で `arc_segment_count` が `usize::MAX` へ飽和し、巨大 `Vec` 確保/OOM 経路になります。Circle/Arc の NaN/Inf 半径も non-finite 点列を返して決定性と後段 profile 検証を壊します。"
    suggestion: "Ellipse/Conic と同様に Circle/Arc でも scalar parameter を `is_finite()` で fail-fast し、`arc_segment_count` の前に `radius`/`start_angle`/`end_angle` を拒否してください。併せて同ファイル内の NaN/Inf 成功テストは `DegenerateSketchElement` 期待へ反転させるべきです。"
  - id: C-F01
    severity: high
    file: "crates/engawa-format/src/feature.rs"
    line_hint: 389
    finding: "`SketchElement::deserialize` が `kind` 欠落時に無条件で legacy `Line` fallback へ落ちるため、`schema_version: 2` の文書でも untagged `{id, from, to}` を静かに受理します。ADR-017 の reject 戦略では v2 は fail-fast のはずで、現状は migration 境界を迂回して壊れた v2 YAML を正当な `Line` に読み替えてしまいます。"
    suggestion: "legacy Line の持ち上げは `schema_version == 1` の migration 経路に限定し、`SketchElement` 単体の Deserialize では untagged 要素を reject してください。少なくとも `schema_version: 2` + `kind` なし profile を失敗させる回帰テストを追加してください。"
  - id: C-F02
