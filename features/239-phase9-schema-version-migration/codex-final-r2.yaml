    suggestion: "この変更は semver-major として扱うか、後方互換を維持したいなら既存の公開 enum 形を壊さない別 API で unknown schema version を返すようにする。少なくとも公開 API 破壊として明示し、下流 crate の match 修正を同時に要求する。"

