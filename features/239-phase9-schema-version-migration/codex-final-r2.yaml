    finding: "`t_boundary_current_version` と未知 version 系の acceptance テストが `CURRENT_SCHEMA_VERSION` ではなく `1` を直書きしており、テスト名どおりの『current version 追従』になっていない。次回 schema bump 時に仕様は正しくてもこのテスト群だけが stale になる。"
    suggestion: "`engawa_format::document::CURRENT_SCHEMA_VERSION` を参照して expected/current を組み立てる。"
  - id: M-F01
    severity: high
