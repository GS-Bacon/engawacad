[workspace]
members = [
    "crates/engawa-kernel",
    "crates/engawa-format",
    "crates/engawa-build",
    "crates/engawa-viewer",
    "crates/engawa-cli",
    "crates/engawa-api",
    "crates/xtask",
]
exclude = ["crates/engawa-format/fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
# Math
nalgebra = { version = "0.33", features = ["serde-serialize"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
# Schema generation
schemars = "0.8"
# Testing
approx = "0.5"
tempfile = "3"
proptest = "1"
rand = "0.9"
serial_test = { version = "3", features = ["file_locks"] }
criterion = "0.5"
# Error handling
thiserror = "2"
# CLI
clap = { version = "4", features = ["derive"] }
# Ordered collections (deterministic iteration)
indexmap = { version = "2", features = ["serde"] }
# HTTP / async
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tower = "0.5"
# TypeScript type generation
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
# Static asset embedding
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
# Browser open
open = "5"
urlencoding = "2"
# Earcut triangulation for concave faces
earcutr = "0.4"
# Internal crates
engawa-format = { path = "crates/engawa-format" }
engawa-kernel = { path = "crates/engawa-kernel" }
engawa-build = { path = "crates/engawa-build" }
engawa-api = { path = "crates/engawa-api" }
